<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tesla-nettlesertest</title>
<style>
  :root { --bg:#111; --fg:#eee; --mut:#999; --ok:#3c3; --bad:#e44; --pad:#222; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.4 system-ui,sans-serif; }
  main { display:grid; grid-template-columns: minmax(280px,1fr) 2fr; gap:12px; padding:12px; height:100vh; }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  td { padding:3px 6px; border-bottom:1px solid #333; vertical-align:top; word-break:break-all; }
  td:first-child { color:var(--mut); white-space:nowrap; word-break:normal; }
  .ok { color:var(--ok); } .bad { color:var(--bad); }
  #pad { position:relative; background:var(--pad); border:2px solid #444; border-radius:8px; touch-action:none; overflow:hidden; }
  #pad canvas { position:absolute; inset:0; width:100%; height:100%; }
  #padinfo { position:absolute; left:8px; top:8px; font:13px monospace; pointer-events:none; white-space:pre; }
  button { font-size:15px; padding:8px 12px; margin:4px 4px 0 0; }
  #left { overflow:auto; }
</style>
</head>
<body>
<main>
  <section id="left">
    <h3 style="margin:0 0 6px">Tesla-nettlesertest</h3>
    <table id="t"></table>
    <button id="beep">Spill testtone</button>
    <button id="copy">Kopier resultat</button>
  </section>
  <section id="pad"><canvas id="c"></canvas><div id="padinfo">Berør feltet (prøv hjørner, dra, to fingre)</div></section>
</main>
<script>
const rows = {};
function set(k, v, ok) {
  if (!rows[k]) { const tr = document.createElement('tr'); tr.innerHTML = '<td></td><td></td>'; tr.cells[0].textContent = k; document.getElementById('t').appendChild(tr); rows[k] = tr; }
  rows[k].cells[1].textContent = v;
  rows[k].cells[1].className = ok === undefined ? '' : (ok ? 'ok' : 'bad');
}
set('Tidspunkt', new Date().toISOString());
set('User agent', navigator.userAgent);
set('Sikker kontekst (HTTPS)', String(window.isSecureContext), window.isSecureContext);
set('Protokoll / vert', location.protocol + ' ' + location.host);
function sizes() {
  set('Viewport (innerW×H)', innerWidth + '×' + innerHeight);
  set('documentElement client', document.documentElement.clientWidth + '×' + document.documentElement.clientHeight);
  set('screen', screen.width + '×' + screen.height);
  set('devicePixelRatio', String(devicePixelRatio));
}
sizes(); addEventListener('resize', sizes);
set('WebSocket', String('WebSocket' in window), 'WebSocket' in window);
set('Worker / OffscreenCanvas', ('Worker' in window) + ' / ' + ('OffscreenCanvas' in window));
set('WebGL', String(!!document.createElement('canvas').getContext('webgl')));
set('WebUSB', String('usb' in navigator));
set('MediaSource', String('MediaSource' in window));
if ('MediaSource' in window) {
  set('MSE avc1.64001f', String(MediaSource.isTypeSupported('video/mp4; codecs="avc1.64001f"')), MediaSource.isTypeSupported('video/mp4; codecs="avc1.64001f"'));
}
set('Touch-hendelser', String('ontouchstart' in window) + ', maxTouchPoints=' + navigator.maxTouchPoints);
set('PointerEvent', String('PointerEvent' in window));
(async () => {
  if (!('VideoDecoder' in window)) { set('WebCodecs VideoDecoder', 'mangler', false); return; }
  set('WebCodecs VideoDecoder', 'finnes', true);
  const codecs = { 'H.264 High 3.1 (avc1.64001f)': 'avc1.64001f', 'H.264 Base 3.1 (avc1.42e01f)': 'avc1.42e01f', 'H.264 High 4.2 (avc1.64002a)': 'avc1.64002a', 'H.265 (hev1.1.6.L120.90)': 'hev1.1.6.L120.90' };
  for (const [name, codec] of Object.entries(codecs)) {
    for (const hw of ['prefer-hardware', 'no-preference']) {
      try {
        const r = await VideoDecoder.isConfigSupported({ codec, codedWidth: 1280, codedHeight: 720, hardwareAcceleration: hw });
        set(name + ' [' + hw + ']', String(r.supported), r.supported);
      } catch (e) { set(name + ' [' + hw + ']', 'feil: ' + e.message, false); }
    }
  }
})();
// fps-måling
let frames = 0, t0 = performance.now();
(function loop(t) { frames++; if (t - t0 >= 2000) { set('requestAnimationFrame fps', (frames * 1000 / (t - t0)).toFixed(1)); frames = 0; t0 = t; } requestAnimationFrame(loop); })(t0);
// berøringsfelt
const pad = document.getElementById('pad'), c = document.getElementById('c'), ctx = c.getContext('2d'), info = document.getElementById('padinfo');
function fit() { const r = pad.getBoundingClientRect(); c.width = r.width * devicePixelRatio; c.height = r.height * devicePixelRatio; ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0); }
fit(); addEventListener('resize', fit);
let maxTouches = 0, events = 0, lastMove = 0, moveGaps = [];
function handle(e) {
  e.preventDefault(); events++;
  const r = pad.getBoundingClientRect(), lines = [];
  const list = e.touches ? Array.from(e.changedTouches) : [e];
  if (e.touches) maxTouches = Math.max(maxTouches, e.touches.length);
  if (e.type.endsWith('move')) { const now = performance.now(); if (lastMove) moveGaps.push(now - lastMove); if (moveGaps.length > 60) moveGaps.shift(); lastMove = now; }
  for (const p of list) {
    const x = (p.clientX - r.left) / r.width, y = (p.clientY - r.top) / r.height;
    ctx.fillStyle = e.type.endsWith('start') || e.type === 'pointerdown' ? '#3c3' : e.type.endsWith('end') || e.type === 'pointerup' ? '#e44' : '#39f';
    ctx.beginPath(); ctx.arc(p.clientX - r.left, p.clientY - r.top, 6, 0, 7); ctx.fill();
    lines.push(e.type + ' x=' + x.toFixed(3) + ' y=' + y.toFixed(3));
  }
  const gap = moveGaps.length ? (moveGaps.reduce((a, b) => a + b, 0) / moveGaps.length).toFixed(1) + ' ms' : '-';
  info.textContent = lines.join('\n') + '\nhendelser=' + events + ' maks samtidige berøringer=' + maxTouches + ' snitt move-intervall=' + gap;
  set('Berøring sett', e.type.startsWith('touch') ? 'touch-hendelser' : 'kun mus/peker', true);
  set('Maks samtidige berøringer', String(maxTouches));
}
if ('ontouchstart' in window) ['touchstart', 'touchmove', 'touchend'].forEach(ev => pad.addEventListener(ev, handle, { passive: false }));
else ['pointerdown', 'pointermove', 'pointerup'].forEach(ev => pad.addEventListener(ev, e => { if (e.type !== 'pointermove' || e.buttons) handle(e); }));
pad.addEventListener('dblclick', () => ctx.clearRect(0, 0, c.width, c.height));
// lyd
document.getElementById('beep').onclick = () => {
  try {
    const a = new (window.AudioContext || window.webkitAudioContext)(), o = a.createOscillator(), g = a.createGain();
    o.frequency.value = 440; g.gain.value = 0.1; o.connect(g).connect(a.destination); o.start(); o.stop(a.currentTime + 1);
    set('Web Audio', 'state=' + a.state + ', sampleRate=' + a.sampleRate + ' (hørte du tonen?)', a.state === 'running');
  } catch (e) { set('Web Audio', 'feil: ' + e.message, false); }
};
document.getElementById('copy').onclick = () => {
  const txt = Object.entries(rows).map(([k, tr]) => k + ': ' + tr.cells[1].textContent).join('\n');
  (navigator.clipboard ? navigator.clipboard.writeText(txt) : Promise.reject()).then(() => alert('Kopiert'), () => prompt('Kopier manuelt:', txt));
};
</script>
</body>
</html>
